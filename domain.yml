version: "3.1"

intents:
  - fazer_pedido
  - fora_do_escopo

entities:
  - sabor
  - quantidade


slots:
  sabor:
    type: text
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: sabor

  quantidade:
    type: text
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: quantidade      

responses:
  utter_confirmar_pedido:
   - text: "Entendi: {quantidade} pizza(s) de {sabor}."
  utter_fora_do_escopo:
   - text: "Desculpe, posso ajudar apenas com pedidos de pizza."

session_config:
  session_expiration_time: 60
  carry_over_slots_to_new_session: true