version: "3.1"

intents:
  - fazer_pedido
  - fora_do_escopo

entities:
  - sabor
  - quantidade

slots: 
  itens_pedido:
    type: text
    influence_conversation: false
    mappings:
      - type: custom

actions: 
  - action_processar_pedido   

responses:
  utter_fora_do_escopo:
   - text: "Desculpe, posso ajudar apenas com pedidos de pizza."

session_config:
  session_expiration_time: 60
  carry_over_slots_to_new_session: false