
# Configuração do projeto
recipe: default.v1
assistant_id: 20261027-000145-oriented-mall
language: pt

# Processamento das mensagens e identificação de intenções e entidades
pipeline:
  - name: WhitespaceTokenizer

  - name: RegexFeaturizer

  - name: LexicalSyntacticFeaturizer

  - name: CountVectorsFeaturizer

  - name: CountVectorsFeaturizer
    analyzer: char_wb
    min_ngram: 1
    max_ngram: 4

  - name: DIETClassifier
    epochs: 100
    constrain_similarities: true

  - name: EntitySynonymMapper

  - name: FallbackClassifier
    threshold: 0.3
    ambiguity_threshold: 0.1

# Políticas de conversação
policies:
  - name: MemoizationPolicy

  - name: RulePolicy

  - name: TEDPolicy
    max_history: 5
    epochs: 100
    constrain_similarities: true
