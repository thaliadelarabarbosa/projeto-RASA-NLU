version: "3.1"

stories:
- story: Testar pedido de calabresa
  steps:
  - user: |
      Quero duas pizzas de calabresa
    intent: fazer_pedido
    entities:
    - quantidade: duas
    - sabor: calabresa
  - action: utter_confirmar_pedido

- story: Testar pedido de quatro queijos
  steps:
  - user: |
      Pode fazer 3 pizzas de quatro queijos
    intent: fazer_pedido
    entities:
    - quantidade: "3"
    - sabor: quatro queijos
  - action: utter_confirmar_pedido

- story: Testar saudação e despedida
  steps:
  - user: |
      Olá
    intent: greet
  - action: utter_greet
  - user: |
      Tchau
    intent: goodbye
  - action: utter_goodbye
